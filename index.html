<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerial's MM2 Values</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#161c2b;--panel:#1f2740;--line:#323d5e;--text:#eceff7;--mute:#9aa6c4;--tape:#f2c200;--ok:#5fd18a;--mid:#e9b949;--bad:#ef6b6b}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Barlow,system-ui,sans-serif}
h1,h2{font-family:"Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.01em}
.tape{height:14px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,#111 14px 28px)}
header,main{max-width:960px;margin:0 auto;padding:20px 16px}
h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1}
header p{color:var(--mute);margin:.6rem 0 0;max-width:60ch}
.note{background:#3a3220;border:1px solid var(--tape);border-radius:8px;padding:10px 14px;margin:0 0 20px;font-size:.92rem}
h2{font-size:1.7rem;margin:28px 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
input[type=search]{flex:1;min-width:160px}
input[type=number]{width:72px}
button{cursor:pointer;font-weight:600}
button:hover{border-color:var(--tape)}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:.88rem}
tr:last-child td{border-bottom:0}
td.num{font-weight:700;font-size:1.1rem}
.small{color:var(--mute);font-size:.85rem}
.badge{padding:2px 9px;border-radius:99px;font-size:.82rem;font-weight:600;border:1px solid}
.hi{color:var(--ok)}.mid{color:var(--mid)}.low{color:var(--bad)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.calc{grid-template-columns:1fr}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.side ul{list-style:none;margin:10px 0;padding:0;min-height:40px}
.side li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.side li button{padding:2px 8px}
.total{font:700 1.8rem "Barlow Condensed",sans-serif}
#verdict{margin-top:12px;padding:14px;border-radius:10px;border:2px solid var(--line);font-weight:600}
.tabs{display:flex;gap:8px;margin:0 0 18px}
.tabs button{font:700 1.3rem "Barlow Condensed",sans-serif;padding:8px 22px}
.tabs button[aria-selected=true]{background:var(--tape);color:#111;border-color:var(--tape)}
.group h2{display:flex;align-items:center;gap:10px}
.swatch{width:14px;height:14px;border-radius:3px;background:var(--c)}
.group h2 small{font:400 .9rem Barlow,sans-serif;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:12px}
.cname{font-weight:600;line-height:1.25}
.cval{font:700 2rem/1.1 "Barlow Condensed",sans-serif;margin:8px 0 2px}
.ctext{font-size:1.15rem;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px}
.chip[aria-pressed=true]{border-color:var(--tape);background:#2a3558}
.chip small{color:var(--mute);font-weight:400}
.dots{display:flex;gap:3px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.rainbow{background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--g) border-box;border-top:4px solid transparent}
.nm{display:flex;align-items:center;gap:8px}
.nm .swatch{flex:none}
.cres{display:grid;gap:6px;margin-bottom:14px}
.cr{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;flex-wrap:wrap}
.cr .nm{flex:1;min-width:160px}
.cr b{min-width:70px;text-align:right}
.cr button{padding:5px 10px;font-size:.9rem}
</style>
</head>
<body>
<div class="tape" aria-hidden="true"></div>
<header>
  <h1>Aerial's MM2 Values</h1>
  <p>Alle wapens per rarity. De value komt van Supreme Values; staat die er niet, dan van MM2Values, anders van Traderie.</p>
</header>
<main>
  <p id="err" class="low"></p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-values" aria-selected="true" data-tab="values">Values</button>
    <button role="tab" id="t-calc" aria-selected="false" data-tab="calc">Trade calculator</button>
  </div>

  <section id="tab-values">
    <div class="chips" id="chips"></div>
    <div class="bar">
      <input type="search" id="q" placeholder="Zoek een item" aria-label="Zoek een item">
      <select id="type" aria-label="Filter op type"><option value="">Alle soorten</option></select>
    </div>
    <div id="groups"></div>
    <p class="small" id="meta"></p>
  </section>

  <section id="tab-calc" hidden>
    <h2>Trade calculator</h2>
    <div class="bar">
      <input type="search" id="cq" placeholder="Zoek een wapen om toe te voegen" aria-label="Zoek een wapen">
      <input type="number" id="qty" value="1" min="1" aria-label="Aantal">
    </div>
    <div id="cres" class="cres"></div>
    <div class="calc">
      <div class="side"><h2>Jij geeft</h2><ul id="la"></ul><div class="total" id="ta">0</div></div>
      <div class="side"><h2>Jij krijgt</h2><ul id="lb"></ul><div class="total" id="tb">0</div></div>
    </div>
    <div id="verdict">Voeg items toe om de trade te beoordelen.</div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString("en-US", { maximumFractionDigits: 2 });
const sides = { a: [], b: [] };
let D;

const median = a => {
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

// Regel: neem de value van MM2Values; staat die er niet, dan Supreme Values; anders Traderie.
function mix(it) {
  const order = D.priority || ["mm2values", "supreme", "traderie"];
  for (const k of order) {
    const raw = it.v && it.v[k];
    if (typeof raw === "string") return { m: null, text: raw, src: (D.sources[k] || {}).label || k };
    if (typeof raw === "number") return { m: raw * ((D.sources[k] || {}).scale || 1), src: (D.sources[k] || {}).label || k };
  }
  return null;
}

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

const RARITIES = [["Common","#9aa0a6"],["Uncommon","#4aa3ff"],["Rare","#4ad66d"],["Legendary","#ef4b4b"],

const RAINBOW = "linear-gradient(90deg,#ff4d4d,#ffb84d,#f2e94d,#4dff88,#4dc3ff,#9b6bff,#ff4fd8)";
let sel = "";

function cardFor(it, color) {
  const x = mix(it), c = el("div", null, "card");
  if (color === "rainbow") { c.classList.add("rainbow"); c.style.setProperty("--g", RAINBOW); }
  else c.style.setProperty("--c", color);
  c.append(el("div", it.name, "cname"), el("div", it.type, "small"));
  const rs = !x && it.rarityNum != null;
  c.append(el("div", x ? (x.m == null ? x.text : fmt(x.m)) : rs ? "Rarity " + it.rarityNum : "–", "cval" + (x && x.m == null ? " ctext" : "")));
  c.append(el("div", x ? x.src : rs ? "Supreme Values" : "Nog geen value", "small"));
  return c;
}

function renderChips() {
  const box = $("#chips"); box.replaceChildren();
  const all = RARITIES.concat([["Onbekend", "#6b7694"]]), counts = {};

  };
  mk("", null, 0);
  all.filter(r => counts[r[0]]).forEach(r => mk(r[0], r[1], counts[r[0]]));
}

function renderTable() {
  const q = $("#q").value.trim().toLowerCase(), t = $("#type").value;
  const box = $("#groups"); box.replaceChildren();
  const list = D.items.filter(i => i.name.toLowerCase().includes(q) && (!t || i.type === t));
  const known = RARITIES.map(r => r[0].toLowerCase());
  const groups = RARITIES.map(([n, c]) => [n, c, list.filter(i => (i.rarity || "").toLowerCase() === n.toLowerCase())]);
  groups.push(["Onbekend", "#6b7694", list.filter(i => !known.includes((i.rarity || "").toLowerCase()))]);
  groups.forEach(([n, c, items]) => {
    if (!items.length || (sel && n !== sel)) return;
    const sec = el("section", null, "group"), h = el("h2");
    const sw = el("span", null, "swatch"); sw.style.setProperty("--c", c === "rainbow" ? RAINBOW : c);
    h.append(sw, n, el("small", items.length + " items"));
    const grid = el("div", null, "grid");
    items.forEach(it => grid.append(cardFor(it, c)));
    sec.append(h, grid); box.append(sec);
  });
  if (!box.children.length) box.append(el("p", "Geen items gevonden. Probeer een andere zoekterm.", "small"));
}

function rarityColor(it) {
  const r = RARITIES.find(x => x[0].toLowerCase() === (it.rarity || "").toLowerCase());
  return !r ? "#6b7694" : r[1] === "rainbow" ? RAINBOW : r[1];
}
function swatchFor(it) { const s = el("span", null, "swatch"); s.style.setProperty("--c", rarityColor(it)); return s; }

function renderResults() {
  const q = $("#cq").value.trim().toLowerCase(), box = $("#cres"); box.replaceChildren();
  if (!q) { box.append(el("p", "Typ een naam om een wapen te zoeken.", "small")); return; }
  const list = D.items.filter(i => { const x = mix(i); return x && x.m != null && i.name.toLowerCase().includes(q); })
    .sort((a, b) => (b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q)) || mix(b).m - mix(a).m).slice(0, 30);
  if (!list.length) { box.append(el("p", "Geen wapen gevonden met een value.", "small")); return; }
  list.forEach(it => {
    const row = el("div", null, "cr"), nm = el("span", null, "nm");
    nm.append(swatchFor(it), it.name, el("small", it.rarity || "", "small"));
    const add = side => { const b = el("button", side === "a" ? "+ Jij geeft" : "+ Jij krijgt");
      b.onclick = () => { sides[side].push({ item: it, qty: Math.max(1, parseInt($("#qty").value) || 1) }); renderCalc(); }; return b; };
    row.append(nm, el("b", fmt(mix(it).m)), add("a"), add("b")); box.append(row);
  });
}

function renderCalc() {
  let tot = { a: 0, b: 0 };
  for (const s of ["a", "b"]) {
    const ul = $("#l" + s); ul.replaceChildren();
    sides[s].forEach((r, i) => {
      const x = mix(r.item); if (!x || x.m == null) return;
      tot[s] += x.m * r.qty;
      const li = el("li"), rm = el("button", "×"); rm.setAttribute("aria-label", "Verwijder " + r.item.name);
      rm.onclick = () => { sides[s].splice(i, 1); renderCalc(); };
      const nm = el("span", null, "nm"); nm.append(swatchFor(r.item), r.qty + "× " + r.item.name + " (" + fmt(x.m) + ")"); li.append(nm, rm);
      ul.append(li);
    });
    $("#t" + s).textContent = fmt(tot[s]);
  }
  const v = $("#verdict"), a = tot.a, b = tot.b;
  if (!a && !b) { v.textContent = "Voeg items toe om de trade te beoordelen."; v.style.borderColor = ""; return; }
  const diff = (b - a) / Math.max(a, b);
  let msg, col;
  if (Math.abs(diff) < 0.05) { msg = "Eerlijke trade"; col = "var(--mid)"; }
  else if (diff > 0) { msg = "Goede trade voor jou: je krijgt ongeveer " + Math.round(diff * 100) + "% meer waarde"; col = "var(--ok)"; }
  else { msg = "Slechte trade voor jou: je geeft ongeveer " + Math.round(-diff * 100) + "% meer waarde"; col = "var(--bad)"; }
  v.textContent = msg; v.style.borderColor = col;
}

async function init() {
  try {
    const r = await fetch("values.json"); D = await r.json();
  } catch (e) {
    try { D = JSON.parse($("#fallback").textContent); }
    catch (e2) { $("#err").textContent = "De data kon niet worden geladen."; return; }
  }
  [...new Set(D.items.map(i => i.type))].forEach(t => { const o = el("option", t); o.value = t; $("#type").append(o); });
  $("#meta").textContent = "Bronnen: " + Object.values(D.sources).map(s => s.label).join(", ") + ". Laatst bijgewerkt: " + D.updated + ".";
  $("#q").oninput = renderTable; $("#type").onchange = renderTable;
  $("#cq").oninput = renderResults; renderResults();
  renderChips(); renderTable(); renderCalc();
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-tab]").forEach(o => o.setAttribute("aria-selected", o === b));
  $("#tab-values").hidden = b.dataset.tab !== "values";
  $("#tab-calc").hidden = b.dataset.tab !== "calc";
});
init();
</script>
</body>
</html>
